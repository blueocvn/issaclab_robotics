seed: 42
device: cuda:0
num_steps_per_env: 32
init_at_random_ep_len: true
max_iterations: 5
empirical_normalization: {}
obs_groups:
  student:
  - wrist_rgb
  - proprioception
  teacher:
  - teacher_state
clip_actions: 1.0
check_for_nan: true
save_interval: 1
experiment_name: so101_box_camera_distillation
run_name: so101-box-workspace-camera-5381-smoke
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: logs/rsl_rl/so101_box_state/2026-10-27_03-19-50_so101-box-workspace-F-refine/model_5381.pt
class_name: DistillationRunner
student:
  class_name: CNNModel
  hidden_dims:
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.05
    std_type: log
    std_range: !!python/tuple
    - 1.0e-06
    - 1000000.0
  cnn_cfg:
    output_channels:
    - 16
    - 32
    - 32
    kernel_size:
    - 5
    - 3
    - 3
    stride:
    - 2
    - 2
    - 2
    dilation: 1
    padding: none
    norm: none
    activation: elu
    max_pool: false
    global_pool: none
    flatten: true
teacher:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.2
    std_type: log
    std_range: !!python/tuple
    - 0.05
    - 0.3
algorithm:
  class_name: isaaclab_tutorial.tasks.place_vial.config.so101.agents.rsl_rl_distillation_cfg:BoundedTeacherDistillation
  num_learning_epochs: 4
  learning_rate: 0.0005
  gradient_length: 1
  max_grad_norm: 1.0
  optimizer: adam
  loss_type: mse
policy: {}
