seed: 67
device: cuda:0
num_steps_per_env: 64
init_at_random_ep_len: false
max_iterations: 500
empirical_normalization: {}
obs_groups:
  actor:
  - wrist_rgb
  - proprioception
  critic:
  - critic
clip_actions: 1.0
check_for_nan: true
save_interval: 100
experiment_name: so101_box_camera_ppo
run_name: camera_ppo_60s_plus500
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: logs/rsl_rl/so101_box_camera_ppo/2026-10-28_16-56-07_camera_ppo_2200_plus1000/model_1048.pt
class_name: OnPolicyRunner
actor:
  class_name: CNNModel
  hidden_dims:
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.05
    std_type: log
    std_range: !!python/tuple
    - 0.01
    - 0.15
  cnn_cfg:
    output_channels:
    - 16
    - 32
    - 32
    kernel_size:
    - 5
    - 3
    - 3
    stride:
    - 2
    - 2
    - 2
    dilation: 1
    padding: none
    norm: none
    activation: elu
    max_pool: false
    global_pool: none
    flatten: true
critic:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg: null
algorithm:
  class_name: PPO
  num_learning_epochs: 4
  num_mini_batches: 4
  learning_rate: 1.0e-05
  schedule: fixed
  gamma: 0.995
  lam: 0.95
  entropy_coef: 0.0
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.1
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  use_mixed_precision: false
  rnd_cfg: null
  symmetry_cfg: null
torch_compile_mode: null
policy: {}
